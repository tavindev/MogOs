[build]
target = "aarch64-unknown-none-softfloat"
# Half of the 12 host cores; rustc codegen threads share this jobserver.
jobs = 6

[target.aarch64-unknown-none-softfloat]
# rust-lld ignores cargo's jobserver, so cap its threads to match.
rustflags = ["-C", "link-arg=--threads=6"]
runner = "qemu-system-aarch64 -M virt -cpu cortex-a72 -smp 4 -m 128M -global virtio-mmio.force-legacy=false -global virtio-mmio.ioeventfd=off -nographic -kernel"

[alias]
# Strings, not arrays: a worktree under `.claude/worktrees` also loads this file, and cargo concatenates arrays (duplicate `--workspace`) but overrides strings.
# Host tests, including the QEMU boot test in `crates/e2e`; arch/board crates only build for the bare-metal target.
test-host = "test --target aarch64-apple-darwin --workspace --exclude qemu-virt --exclude arch"
# Host benchmarks (`benches/*.rs`, harness = false) for the same crates.
bench-host = "bench --target aarch64-apple-darwin --workspace --exclude qemu-virt --exclude arch --bench *"
# An empty 64 MiB MogFS image, `disk.img` in the current directory (overwrites it).
mkfs = "run -p mogfs --example mkfs --target aarch64-apple-darwin -- disk.img"
# Boots into msh with `disk.img` attached; `[ -f disk.img ] || cargo mkfs; cargo shell` formats it first if missing.
shell = "run -- -drive file=disk.img,if=none,format=raw,id=d0 -device virtio-blk-device,drive=d0 -append test=shell"
# Boots into the HTTP echo server on QEMU's user network, forwarded from the host's 127.0.0.1:8080 to the guest's port 80.
httpd = "run -- -netdev user,id=n0,hostfwd=tcp:127.0.0.1:8080-10.0.2.15:80 -device virtio-net-device,netdev=n0 -append test=httpd"
# Array alias (its quoted runner can't be a string), so it doesn't work inside nested worktrees.
# Same as `cargo run`, but in a QEMU window that doesn't grab the mouse and stays open after power-off.
window = ["run", "--config", "target.aarch64-unknown-none-softfloat.runner='qemu-system-aarch64 -M virt -cpu cortex-a72 -smp 4 -m 128M -global virtio-mmio.force-legacy=false -global virtio-mmio.ioeventfd=off -device virtio-tablet-pci -display cocoa,show-cursor=on -serial vc -no-shutdown -kernel'"]
