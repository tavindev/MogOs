# User programs, built for the kernel's target by the board's build.rs and bundled into its boot archive.
# Outside the workspace: its bins would break `cargo run` and host tests.
[package]
name = "user"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Its own root, also when a worktree nests this repo inside another checkout.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

[profile.release]
opt-level = "s"
strip = true
